name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.40"

      - name: Build books
        run: |
          set -e
          for dir in books/*/; do
            name=$(basename "$dir")
            echo "::group::building $name"
            (cd "$dir" && mdbook build -d "$GITHUB_WORKSPACE/_site/$name")
            echo "::endgroup::"
          done

      - name: Assemble shelf
        run: cp -r site/. _site/

      # Pages 站点需存在（Source = GitHub Actions）。工作流的临时令牌无权创建站点，
      # 所以这里不加 enablement，Site 未开时会直接报出可读的提示。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
