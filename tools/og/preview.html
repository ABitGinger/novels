<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 900px; height: 690px; overflow: hidden; }
  body {
    background: #ededed;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    padding: 26px 34px;
  }
  .label {
    font-size: 12px; color: #8a8a8a; letter-spacing: .12em;
    margin: 0 0 8px 2px;
  }
  .card {
    display: flex; background: #fff; border-radius: 10px;
    padding: 14px 14px 14px 20px; margin-bottom: 18px;
    height: 152px;
  }
  .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .title {
    font-size: 24px; color: #191919; line-height: 1.32;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .desc {
    font-size: 16px; color: #9a9a9a; line-height: 1.4; margin-top: 9px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .thumb {
    width: 124px; height: 124px; margin-left: 18px; flex: none;
    border-radius: 4px; overflow: hidden; background: #f0ece4;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
</style>
</head>
<body>
  <div class="label">① 分享书架首页　/novels/</div>
  <div class="card">
    <div class="txt">
      <div class="title">书房 ·《无职者》全本在线阅读</div>
      <div class="desc">一个被培育出来、却没有被赋予任何用途的生物，在一座正在慢慢饿死的活体世界里，寻找「我是什么」。</div>
    </div>
    <div class="thumb"><img src="../../site/assets/og-shelf.png"></div>
  </div>

  <div class="label">② 分享某本书的扉页　/novels/wuzhizhe/</div>
  <div class="card">
    <div class="txt">
      <div class="title">《无职者》· 看，也是一种使用。</div>
      <div class="desc">一个被培育出来、却没有被赋予任何用途的生物，在一座正在慢慢饿死的活体世界里，寻找「我是什么」。</div>
    </div>
    <div class="thumb"><img src="../../site/assets/og-wuzhizhe.png"></div>
  </div>

  <div class="label">③ 分享具体章节　/novels/wuzhizhe/卷一_误/01_育.html</div>
  <div class="card">
    <div class="txt">
      <div class="title">第一章 · 育 - 无职者</div>

    </div>
    <div class="thumb"><img src="../../site/assets/og-wuzhizhe.png"></div>
  </div>
</body>
</html>
