<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 1200px; overflow: hidden; }
  body {
    background: #f7f3ec;
    background-image:
      radial-gradient(110% 80% at 50% 20%, rgba(255,255,255,.9), rgba(247,243,236,0) 60%),
      radial-gradient(85% 60% at 50% 105%, rgba(140,90,43,.11), rgba(140,90,43,0) 70%);
    font-family: "Noto Serif SC", "NotoSerifSC", "Source Han Serif SC", "SimSun", serif;
    color: #1d1a16;
    position: relative;
  }
  .inner {
    position: absolute; left: 0; right: 0; top: 300px; height: 600px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .kicker {
    font-size: 17px; letter-spacing: .7em; text-indent: .7em;
    color: #968c7b; margin-bottom: 40px;
  }
  h1 {
    font-size: __TITLE_SIZE__px; font-weight: 600; line-height: 1.02;
    letter-spacing: .14em; text-indent: .14em;
  }
  .quote {
    margin-top: 44px;
    font-size: 30px; letter-spacing: .12em; text-indent: .12em; color: #5a5245;
  }
  .foot {
    margin-top: 54px;
    font-size: 18px; letter-spacing: .3em; text-indent: .3em; color: #a1968a;
  }
  .seal {
    position: absolute; right: 126px; bottom: 336px;
    width: 72px; height: 72px; border-radius: 4px;
    background: #9e3b2c; color: #f7f3ec;
    font-size: 38px; line-height: 72px; text-align: center;
    box-shadow: 0 0 0 3px rgba(158,59,44,.16);
  }
</style>
</head>
<body>
  <div class="inner">
    <div class="kicker">__AUTHOR__</div>
    <h1>__BOOK__</h1>
    <div class="quote">__QUOTE__</div>
    <div class="foot">__META__</div>
  </div>
  <div class="seal">__SEAL__</div>
</body>
</html>
